version: "3.8"

services:
  backend:
    build: ./backend
    expose:
      - 8080

  frontend:
    build: ./frontend
    expose:
      - 5173

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - frontend
